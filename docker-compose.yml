services:
  # =======================================================================
  # INFRASTRUCTURE TIER
  # =======================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fa_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - finance_network

  redis:
    image: redis:7.2-alpine
    container_name: fa_redis
    restart: unless-stopped
    ports:
      - "5207:6379" # Maps your appsettings port 5207 straight to internal 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - finance_network

  # =======================================================================
  # APPLICATION SERVICES TIER (.NET 10 Microservices)
  # =======================================================================
  identity-service:
    build:
      context: ./src/IdentityService
      dockerfile: Dockerfile
    container_name: fa_identity
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5205 # Binds to internal container port 5205
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/Identity.db
      - RabbitMQ__Host=rabbitmq
    volumes:
      - identity_db_data:/app/data
    depends_on:
      - rabbitmq
    networks:
      - finance_network

  wallet-service:
    build:
      context: ./src/WalletService
      dockerfile: Dockerfile
    container_name: fa_wallet
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5202 # Binds to internal container port 5202
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/Wallet.db
      - Redis__Host=redis
      - RabbitMQ__Host=rabbitmq
    volumes:
      - wallet_db_data:/app/data
    depends_on:
      - rabbitmq
      - redis
    networks:
      - finance_network

  yarp-gateway:
    build:
      context: ./src/YarpGateway
      dockerfile: Dockerfile
    container_name: fa_gateway
    restart: unless-stopped
    ports:
      - "5153:5153" # EXPOSED: Maps host port 5153 straight to container internal port 5153 for frontend (React)
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5153 # App listens on port 5153 inside the container
    command: >
      dotnet YarpGateway.dll 
      --ReverseProxy:Clusters:identity-cluster:Destinations:destination1:Address=http://identity-service:5205
      --ReverseProxy:Clusters:wallet-cluster:Destinations:destination1:Address=http://wallet-service:5202
    depends_on:
      - identity-service
      - wallet-service
    networks:
      - finance_network

# =======================================================================
# PERSISTENT DATA TIERS & LOGICAL ISOLATION BRIDGES
# =======================================================================
volumes:
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  identity_db_data:
    driver: local
  wallet_db_data:
    driver: local

networks:
  finance_network:
    driver: bridge