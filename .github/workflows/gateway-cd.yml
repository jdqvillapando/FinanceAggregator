name: YARP Gateway CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/YarpGateway/**'
  workflow_dispatch:

jobs:
  deploy-to-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Log in to Azure CLI
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      # 3. Build & Push Image to Docker Hub
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=docker.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_GATEWAY_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_NAME -f src/YarpGateway/Dockerfile .
          docker push $IMAGE_NAME

      # 4. Deploy Image from Docker Hub to Azure Container Apps
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ secrets.AZURE_CAPP_GATEWAY_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_GATEWAY_NAME }}:${{ github.sha }}