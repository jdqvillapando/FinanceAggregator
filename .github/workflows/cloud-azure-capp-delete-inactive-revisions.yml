name: Delete Inactive Revisions

on:
    workflow_dispatch:
        inputs:
            container-option:
                description: 'Select Container'
                required: false
                type: choice
                default: 'API Gateway'
                options:
                    - 'API Gateway'
                    - 'Identity Service'
                    - 'Wallet Service'
                    - 'Redis'
    workflow_call:
        inputs:
            container-option:
                description: 'Set Target Container'
                required: false
                type: string
                default: 'API Gateway'

jobs:
    delete-inactive-revisions:
        runs-on: ubuntu-latest
        steps:
            - name: Log in to Azure
              uses: azure/login@v2
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Run Azure Container Apps command for deleting revision
              run: |
                CONTAINER_OPTION="${{ inputs.container-option }}"
                TARGET_APP=""

                if [ "$CONTAINER_OPTION" == "API Gateway" ]; then
                    TARGET_APP="${{ secrets.AZURE_CAPP_GATEWAY_NAME }}"
                elif [ "$CONTAINER_OPTION" == "Identity Service" ]; then
                    TARGET_APP="${{ secrets.AZURE_CAPP_IDENTITY_NAME }}"
                elif [ "$CONTAINER_OPTION" == "Wallet Service" ]; then
                    TARGET_APP="${{ secrets.AZURE_CAPP_WALLET_NAME }}"
                elif [ "$CONTAINER_OPTION" == "Redis" ]; then
                    TARGET_APP="redis"
                else
                    echo "::error::Invalid container selection: $CONTAINER_OPTION"
                    exit 1
                fi

                RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"

                INACTIVE_REVS=$(az containerapp revision list \
                    --name "$TARGET_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --all \
                    --query "[?properties.active==\`false\`].name" \
                    -o tsv)

                if [ -z "$INACTIVE_REVS" ]; then
                    echo "No inactive revisions found for $TARGET_APP."
                    exit 0
                fi

                # 3. Iterate through and delete each inactive revision
                for REV in $INACTIVE_REVS; do
                    echo "Deleting inactive revision: $REV"
                    az containerapp revision delete \
                    --name "$TARGET_APP" \
                    --resource-group "$RESOURCE_GROUP" \
                    --revision "$REV" \
                    --yes
                done

                echo "Inactive revisions cleanup completed successfully."
            