name: Identity Service CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/IdentityService/**'
  workflow_dispatch:

jobs:
  deploy-to-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=docker.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IDENTITY_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_NAME -f ./src/IdentityService/Dockerfile ./src/IdentityService
          docker push $IMAGE_NAME

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ secrets.AZURE_CAPP_IDENTITY_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IDENTITY_NAME }}:${{ github.sha }}