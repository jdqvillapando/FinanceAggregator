name: Scheduled Environment & Maintenance (Hard Start/Stop) Toggle

on:
  schedule:
    # 1:00 PM PST (UTC+8) (05:00 UTC) Monday-Friday: Start containers + Disable Maintenance
    - cron: '0 5 * * 1-5'
    # 3:00 PM PST (UTC+8) (07:00 UTC) Monday-Friday: Stop containers + Enable Maintenance
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose mode to run manually'
        required: true
        type: choice
        default: 'enable_active_mode'
        options:
            - 'enable_active_mode'
            - 'enable_maintenance_mode'

jobs:
  # ----------------------------------------------------------------------
  # JOB 1: SCALE UP CONTAINERS & DISABLE MAINTENANCE MODE (1:00 PM UTC+8)
  # ----------------------------------------------------------------------
  scale-up-containers:
    if: github.event.schedule == '0 5 * * 1-5' || inputs.action == 'enable_active_mode'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Open the Yarp Gateway
        run: |
          echo "Enabling API Gateway..."
          az containerapp update \
            --name ${{ secrets.AZURE_CAPP_GATEWAY_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --set-env-vars "GatewaySettings__MaintenanceModeEnabled=false" \
            --min-replicas 1 \
            --max-replicas 1

      - name: Scale UP Backend Microservices
        run: |
          APPS=(
            "${{ secrets.AZURE_CAPP_IDENTITY_NAME }}" 
            "${{ secrets.AZURE_CAPP_WALLET_NAME }}" 
            "redis"
          )
          for APP in "${APPS[@]}"; do
            echo "Scaling UP $APP to 1 replica..."
            az containerapp update \
              --name "$APP" \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --min-replicas 1 \
              --max-replicas 1
          done

  deploy-frontend-active:
    needs: scale-up-containers
    # Call reusable workflow directly at job level
    uses: ./.github/workflows/frontend-cd.yml
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    with:
      maintenance_mode: 'false'
    secrets: inherit

  # --------------------------------------------------------------------
  # JOB 2: SCALE DOWN CONTAINERS & ENABLE MAINTENANCE MODE (3:00 PM UTC+8)
  # --------------------------------------------------------------------
  scale-down-containers:
    if: github.event.schedule == '0 7 * * 1-5' || inputs.action == 'enable_maintenance_mode'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Close the Yarp Gateway
        run: |
          echo "Disabling API Gateway..."
          az containerapp update \
            --name ${{ secrets.AZURE_CAPP_GATEWAY_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --set-env-vars "GatewaySettings__MaintenanceModeEnabled=true" \
            --min-replicas 0 \
            --max-replicas 0

      - name: Scale DOWN Backend Microservices
        run: |
          APPS=(
            "${{ secrets.AZURE_CAPP_IDENTITY_NAME }}" 
            "${{ secrets.AZURE_CAPP_WALLET_NAME }}" 
            "redis"
          )
          for APP in "${APPS[@]}"; do
            echo "Scaling DOWN $APP to 0 replica..."
            az containerapp update \
              --name "$APP" \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --min-replicas 0 \
              --max-replicas 0
          done

  deploy-frontend-maintenance:
    needs: scale-down-containers
    uses: ./.github/workflows/frontend-cd.yml
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    with:
      maintenance_mode: 'true'
    secrets: inherit